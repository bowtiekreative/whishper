events {
    worker_connections 1024;
}

http {
    gzip on;

    server {
        listen 80;

        # Internal endpoint used to authenticate static media requests.
        location = /auth_verify {
            internal;
            proxy_pass http://127.0.0.1:8080/api/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location /api/video {
            # Require a valid session cookie or X-API-Key (no-op when auth is
            # disabled, i.e. WHISHPER_API_KEY is unset).
            auth_request /auth_verify;
            alias /app/uploads/;
        }

        location /languages {
            proxy_pass http://translate:5000;
        }

        location /api {
            client_max_body_size 0;
            proxy_pass http://127.0.0.1:8080;
        }

        location /ws {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
        }    
    }
}